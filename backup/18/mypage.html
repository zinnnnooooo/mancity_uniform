<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNI:CITY | 마이페이지</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/mypage.css" />
</head>
<body>
  <div class="app-frame mypage">
    <header class="mypage-topbar">
      <button type="button" class="topbar-btn" id="backBtn" aria-label="뒤로가기">←</button>
      <a href="uni_list.html" class="mypage-logo" aria-label="UNI:CITY 홈">UNI:CITY</a>
      <a href="cart.html" class="topbar-btn cart-link" aria-label="장바구니">♧</a>
    </header>

    <main>
      <section class="profile-section">
        <div class="profile-image-wrap">
          <img src="img/profile.jpg" alt="사용자 프로필 이미지" class="profile-image" />
        </div>
        <h1>CTID9320</h1>
        <p>맨시티 팬</p>
      </section>

      <section class="summary-grid" aria-label="마이페이지 요약">
        <button class="summary-card" type="button" data-action="orders">
          <strong>12</strong>
          <span>주문 내역</span>
        </button>
        <button class="summary-card summary-card--active" type="button" data-action="shipping">
          <i class="summary-dot" aria-hidden="true"></i>
          <strong>1</strong>
          <span>배송 중</span>
        </button>
        <button class="summary-card" type="button" data-action="wishlist">
          <strong>8</strong>
          <span>위시리스트</span>
        </button>
      </section>

      <section class="recent-order">
        <div class="section-title-row">
          <h2>최근 주문 내역</h2>
          <button type="button" class="detail-link" id="orderDetailBtn">상세보기 <span>›</span></button>
        </div>

        <div class="recent-order__body">
          <img src="img/recent_order_kit.jpg" alt="26/27 홈 레플리카 유니폼" class="order-thumb" />

          <div class="order-info">
            <span class="status-badge">상품 준비 중</span>
            <h3>26/27 홈 레플리카 유니폼</h3>
            <p>옵션: L / 마킹: FODEN 47</p>
            <strong class="order-price">₩189,000</strong>
          </div>
        </div>

        <ol class="order-progress" aria-label="주문 진행 상태">
          <li class="is-complete">
            <span class="progress-icon"></span>
            <em>결제완료</em>
          </li>
          <li class="is-current">
            <span class="progress-icon"></span>
            <em>상품준비</em>
          </li>
          <li>
            <span class="progress-icon"></span>
            <em>배송중</em>
          </li>
          <li>
            <span class="progress-icon"></span>
            <em>배송완료</em>
          </li>
        </ol>
      </section>

      <section class="mypage-menu" aria-label="마이페이지 메뉴">
        <button class="menu-row" type="button" data-target="orders">
          <span class="menu-icon">↶</span>
          <span class="menu-label">구매내역</span>
          <span class="menu-arrow">›</span>
        </button>

        <a class="menu-row" href="delivery_info.html">
          <span class="menu-icon">▱</span>
          <span class="menu-label">배송추적</span>
          <span class="menu-arrow">›</span>
        </a>

        <button class="menu-row" type="button" data-target="wishlist">
          <span class="menu-icon">♡</span>
          <span class="menu-label">위시리스트</span>
          <span class="menu-arrow">›</span>
        </button>

        <button class="menu-row" type="button" data-target="profile">
          <span class="menu-icon">♙</span>
          <span class="menu-label">개인정보 수정</span>
          <span class="menu-arrow">›</span>
        </button>

        <button class="menu-row" type="button" data-target="support">
          <span class="menu-icon">?</span>
          <span class="menu-label">고객센터</span>
          <span class="menu-arrow">›</span>
        </button>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="하단 네비게이션">
      <a href="uni_list.html" aria-label="홈">⌂</a>
      <a href="cart.html" aria-label="장바구니">♧</a>
      <button type="button" aria-label="위시리스트" data-target="wishlist">♡</button>
      <a href="mypage.html" class="is-active" aria-current="page" aria-label="마이페이지">♟</a>
    </nav>
  </div>

  <script src="js/common.js"></script>
  <script src="js/mypage.js"></script>
</body>
</html>
