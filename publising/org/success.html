<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNI:CITY | 결제 완료</title>
  <style>
    :root {
      --navy-dark: #080c1e;
      --navy-deep: #10193B;
      --navy-card: #16224A;
      --sky-blue: #6CABDD;
      --yellow: #DFFF00;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.7);
    }

    body {
      background-color: var(--navy-dark);
      color: var(--white);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 20px;
    }

    .success-container {
      width: 100%;
      max-width: 440px;
      background: var(--navy-deep);
      border: 1px solid rgba(108, 171, 221, 0.2);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.4),
        inset 0 0 15px rgba(108, 171, 221, 0.05);
    }

    .success-brand {
      margin-bottom: 24px;
    }

    .success-brand__name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--white);
      margin: 0;
    }

    .success-brand__tag {
      font-size: 11px;
      color: var(--sky-blue);
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    .success-badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--yellow);
      color: var(--navy-dark);
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .status-card {
      background: var(--navy-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .status-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--white);
      margin: 0 0 12px;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    .info-table tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .info-table tr:last-child {
      border-bottom: none;
    }

    .info-table td {
      padding: 10px 0;
    }

    .info-table td.label {
      color: var(--muted);
      width: 100px;
    }

    .info-table td.value {
      font-weight: 700;
      color: var(--white);
      text-align: right;
    }

    .info-table td.value--price {
      color: var(--yellow);
    }

    .action-btn {
      width: 100%;
      height: 46px;
      background: var(--sky-blue);
      color: var(--navy-dark);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(108, 171, 221, 0.25);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: #8cc4ee;
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="success-badge">✓</div>
    <div class="success-brand">
      <h1 class="success-brand__name">UNI:CITY</h1>
      <div class="success-brand__tag">TOSS PAYMENTS SUCCESS</div>
    </div>

    <div class="status-card">
      <h2 class="status-title">주문 및 결제 성공!</h2>
      <table class="info-table">
        <tr>
          <td class="label">주문번호</td>
          <td class="value" id="orderId">-</td>
        </tr>
        <tr>
          <td class="label">결제금액</td>
          <td class="value value--price" id="amount">0원</td>
        </tr>
        <tr>
          <td class="label">결제 키</td>
          <td class="value" id="paymentKey" style="font-family: monospace; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px;">-</td>
        </tr>
      </table>
    </div>

    <button type="button" class="action-btn" onclick="goMyPage()">마이페이지로 이동</button>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const paymentKey = params.get('paymentKey');
      const orderId = params.get('orderId');
      const amount = params.get('amount');

      if (orderId) document.getElementById('orderId').textContent = orderId;
      if (amount) {
        const formattedAmount = Number(amount).toLocaleString() + '원';
        document.getElementById('amount').textContent = formattedAmount;
      }
      if (paymentKey) {
        document.getElementById('paymentKey').textContent = paymentKey;
      }

      // 장바구니에서 선택된(결제 완료된) 아이템 제거
      try {
        const cartItems = JSON.parse(localStorage.getItem('unicity_cart')) || [];
        const remainingCart = cartItems.filter(item => item.checked === false);
        localStorage.setItem('unicity_cart', JSON.stringify(remainingCart));
      } catch (e) {
        console.error('Failed to update cart after payment:', e);
      }
    })();

    function goMyPage() {
      window.location.href = './mypage.html';
    }
  </script>
</body>
</html>
