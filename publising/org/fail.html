<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNI:CITY | 결제 실패</title>
  <style>
    :root {
      --navy-dark: #080c1e;
      --navy-deep: #10193B;
      --navy-card: #16224A;
      --sky-blue: #6CABDD;
      --yellow: #DFFF00;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.7);
    }

    body {
      background-color: var(--navy-dark);
      color: var(--white);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 20px;
    }

    .fail-container {
      width: 100%;
      max-width: 440px;
      background: var(--navy-deep);
      border: 1px solid rgba(234, 67, 53, 0.3);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.4),
        inset 0 0 15px rgba(234, 67, 53, 0.02);
    }

    .fail-brand {
      margin-bottom: 24px;
    }

    .fail-brand__name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--white);
      margin: 0;
    }

    .fail-brand__tag {
      font-size: 11px;
      color: #EA4335;
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    .fail-badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #EA4335;
      color: var(--white);
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .status-card {
      background: var(--navy-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .status-title {
      font-size: 16px;
      font-weight: 800;
      color: #EA4335;
      margin: 0 0 12px;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    .info-table tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .info-table tr:last-child {
      border-bottom: none;
    }

    .info-table td {
      padding: 10px 0;
    }

    .info-table td.label {
      color: var(--muted);
      width: 100px;
    }

    .info-table td.value {
      font-weight: 700;
      color: var(--white);
      text-align: right;
    }

    .info-table td.value--error {
      color: #EA4335;
      word-break: break-all;
    }

    .action-btn {
      width: 100%;
      height: 46px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="fail-container">
    <div class="fail-badge">✕</div>
    <div class="fail-brand">
      <h1 class="fail-brand__name">UNI:CITY</h1>
      <div class="fail-brand__tag">TOSS PAYMENTS FAIL</div>
    </div>

    <div class="status-card">
      <h2 class="status-title">결제 실패</h2>
      <table class="info-table">
        <tr>
          <td class="label">에러 코드</td>
          <td class="value" id="code">-</td>
        </tr>
        <tr>
          <td class="label">사유</td>
          <td class="value value--error" id="message">-</td>
        </tr>
      </table>
    </div>

    <button type="button" class="action-btn" onclick="goCheckout()">주문 결제 페이지로 돌아가기</button>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const message = params.get('message');

      if (code) document.getElementById('code').textContent = code;
      if (message) document.getElementById('message').textContent = message;
    })();

    function goCheckout() {
      window.location.href = './checkout.html';
    }
  </script>
</body>
</html>
