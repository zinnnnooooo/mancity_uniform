<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>UNI:CITY | 주문/결제</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="checkout.css" />
</head>

<body class="checkout-page-body">
  <div class="app-frame">
    <div class="checkout-page-content">

      <header class="checkout-topbar">
        <button type="button" class="icon-btn" id="btnBack" aria-label="뒤로가기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <h1 class="checkout-topbar__title">주문 / 결제</h1>
        <div class="checkout-topbar__side"></div>
      </header>

      <section class="co-section">
        <div class="co-section__head">
          <h2 class="co-section__title">배송지 정보</h2>
          <div class="co-addr-tabs">
            <button type="button" class="co-addr-tab is-active" id="tabDefaultAddr">기본 배송지</button>
            <button type="button" class="co-addr-tab" id="tabNewAddr">+ 직접 입력</button>
          </div>
        </div>

        <div class="co-card co-address-card" id="viewDefaultAddr">
          <div class="co-address__header">
            <span class="co-badge" id="displayAddrBadge">기본 배송지</span>
            <span class="co-address__user" id="displayAddrUser">CTID9320 (010-9320-2026)</span>
          </div>
          <p class="co-address__main" id="displayAddrMain">서울특별시 강남구 테헤란로 123 맨시티빌딩 9층</p>
          <p class="co-address__sub" id="displayAddrSub">(역삼동, 시티인사이트)</p>

          <div class="co-dropdown" id="deliveryReqDropdown">
            <button type="button" class="co-dropdown__trigger" id="deliveryReqTrigger">
              <span id="deliveryReqText">배송 시 요청사항을 선택해주세요</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="co-dropdown__icon">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div class="co-dropdown__menu" id="deliveryReqMenu">
              <button type="button" class="co-dropdown__item is-selected" data-val="직접 수령하겠습니다">직접 수령하겠습니다</button>
              <button type="button" class="co-dropdown__item" data-val="부재 시 경비실에 맡겨주세요">부재 시 경비실에 맡겨주세요</button>
              <button type="button" class="co-dropdown__item" data-val="부재 시 문 앞에 놓아주세요">부재 시 문 앞에 놓아주세요</button>
              <button type="button" class="co-dropdown__item" data-val="배송 전 미리 연락 바랍니다">배송 전 미리 연락 바랍니다</button>
            </div>
          </div>
        </div>

        <div class="co-card co-new-address-card" id="viewNewAddr" style="display: none;">
          <div class="co-form-group">
            <div class="co-form-row co-form-row--half">
              <input type="text" class="co-input" id="inputRecipient" placeholder="수령인 이름" value="CTID9320" />
              <input type="tel" class="co-input" id="inputPhone" placeholder="휴대폰 번호 (- 없이)" value="01093202026" />
            </div>

            <div class="co-form-row co-form-row--search">
              <input type="text" class="co-input" id="inputAddress" placeholder="기본 주소 (예: 테헤란로 123)" />
              <button type="button" class="co-search-addr-btn" id="btnSearchAddr">주소 검색</button>
            </div>

            <div class="co-form-row">
              <input type="text" class="co-input" id="inputAddressDetail" placeholder="상세 주소 입력 (동, 호수, 건물명 등)" />
            </div>
          </div>

          <button type="button" class="co-submit-addr-btn" id="btnSubmitNewAddr">주소 입력 완료</button>
        </div>
      </section>

      <section class="co-section">
        <div class="co-section__head">
          <h2 class="co-section__title">주문 상품 (<span id="coItemCount">0</span>개)</h2>
          <button type="button" class="co-toggle-btn" id="btnToggleItems" aria-expanded="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" class="co-toggle-icon">
              <path d="M18 15l-6-6-6 6" />
            </svg>
          </button>
        </div>
        <div class="co-item-list" id="coItemList">
        </div>
      </section>

      <section class="co-section">
        <div class="co-section__head">
          <h2 class="co-section__title">결제 수단</h2>
        </div>
        <div class="co-payment-grid" id="paymentGrid">
          <button type="button" class="co-pay-btn is-active" data-pay="card">
            <span class="co-pay-btn__icon">💳</span>
            <span>신용/체크카드</span>
          </button>
          <button type="button" class="co-pay-btn" data-pay="toss">
            <span class="co-pay-btn__icon">🔵</span>
            <span>토스</span>
          </button>
          <button type="button" class="co-pay-btn" data-pay="vbank">
            <span class="co-pay-btn__icon">🏦</span>
            <span>무통장입금</span>
          </button>
        </div>
      </section>

      <section class="co-summary-panel">
        <h2 class="co-summary__title">최종 결제 금액</h2>

        <div class="co-summary__row">
          <span>총 상품 금액</span>
          <span id="coSumProduct">0원</span>
        </div>
        <div class="co-summary__row">
          <span>마킹 추가 금액</span>
          <span id="coSumMarking">+0원</span>
        </div>
        <div class="co-summary__row">
          <span>패치 추가 금액</span>
          <span id="coSumPatch">+0원</span>
        </div>
        <div class="co-summary__row">
          <span>배송비</span>
          <span id="coSumShipping">0원</span>
        </div>

        <hr class="co-divider" />

        <div class="co-summary__row co-summary__row--total">
          <span>총 결제 예정 금액</span>
          <span class="co-summary__total-val" id="coSumTotal">0원</span>
        </div>
      </section>

      <section class="co-agree-section">
        <label class="co-checkbox">
          <input type="checkbox" id="checkAgree" checked />
          <span class="co-checkbox__box"></span>
          <span class="co-checkbox__label">주문 상품 정보 및 결제 조건에 동의합니다 (필수)</span>
        </label>
      </section>

      <div class="co-bottom-spacer"></div>

      <div class="co-cta-bar">
        <button type="button" class="btn co-cta-btn" id="btnPay">0원 결제하기</button>
      </div>

      <div class="co-modal" id="optModal" aria-hidden="true">
        <div class="co-modal__dialog co-opt-modal__dialog">
          <div class="co-opt-modal__header">
            <h3 class="co-opt-modal__title">옵션 변경</h3>
            <button type="button" class="co-opt-modal__close" id="btnCloseOptModal" aria-label="닫기">✕</button>
          </div>

          <div class="co-opt-modal__body">
            <p class="co-opt-target-name" id="optTargetName">유니폼 상품명</p>

            <div class="co-opt-group">
              <label class="co-opt-label">사이즈</label>
              <div class="co-opt-size-list" id="optSizeList">
              </div>
            </div>

            <div class="co-opt-group">
              <label class="co-opt-label">선수 마킹</label>
              <div class="co-dropdown" id="optMarkingDropdown">
                <button type="button" class="co-dropdown__trigger" id="optMarkingTrigger">
                  <span id="optMarkingText">No marking</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="co-dropdown__icon">
                    <path d="M6 9l6 6 6-6" />
                  </svg>
                </button>
                <div class="co-dropdown__menu" id="optMarkingMenu">
                </div>
              </div>
            </div>

            <div class="co-opt-group">
              <label class="co-opt-label">오피셜 패치</label>
              <div class="co-dropdown" id="optPatchDropdown">
                <button type="button" class="co-dropdown__trigger" id="optPatchTrigger">
                  <span id="optPatchText">No patch</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="co-dropdown__icon">
                    <path d="M6 9l6 6 6-6" />
                  </svg>
                </button>
                <div class="co-dropdown__menu" id="optPatchMenu">
                </div>
              </div>
            </div>
          </div>

          <div class="co-opt-modal__footer">
            <button type="button" class="btn co-opt-modal__submit-btn" id="btnSaveOption">변경사항 적용하기</button>
          </div>
        </div>
      </div>

      <div class="co-modal" id="successModal" aria-hidden="true">
        <div class="co-modal__dialog">
          <div class="co-modal__badge">✓</div>
          <h3 class="co-modal__title">주문 및 결제 완료!</h3>
          <p class="co-modal__desc">맨체스터 시티 공식 유니폼 주문이<br>성공적으로 접수되었습니다.</p>
          <div class="co-modal__info">
            <div class="co-modal__row">
              <span>주문번호</span>
              <strong id="modalOrderNo">MC2026-9320</strong>
            </div>
            <div class="co-modal__row">
              <span>배송지</span>
              <strong id="modalAddress"
                style="max-width: 180px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">맨시티빌딩
                9층</strong>
            </div>
            <div class="co-modal__row">
              <span>최종 결제 금액</span>
              <strong class="co-modal__price" id="modalPrice">0원</strong>
            </div>
          </div>
          <button type="button" class="btn co-modal__btn" id="btnConfirmSuccess">마이페이지에서 확인</button>
        </div>
      </div>

    </div>
  </div>

  <script src="products_data.js"></script>
  <script src="common.js"></script>
  <script src="checkout.js"></script>
</body>

</html>
